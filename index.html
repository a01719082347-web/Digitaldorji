
<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#009688">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="manifest.json">
    <link rel="shortcut icon" href="https://cdn-icons-png.flaticon.com/512/3050/3050222.png">
    <title>Digital দর্জি</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'app-green': '#009688',
            }
          }
        }
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Hind Siliguri', sans-serif;
            background-color: #f3f4f6;
            margin: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
        }
        #loading-screen {
            position: fixed;
            inset: 0;
            background: #009688;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.5s ease-out;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid rgba(255,255,255,0.3);
            border-top: 5px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Custom pulse-slow animation for background elements */
        .animate-pulse-slow {
            animation: pulse-slow 6s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pulse-slow {
            0%, 100% { opacity: 0.2; }
            50% { opacity: 0.4; }
        }
        /* Custom radial gradient for backgrounds */
        .bg-gradient-radial {
            background-image: radial-gradient(circle, var(--tw-gradient-stops));
        }

        /* NEW: Print-specific styles */
        @media print {
            body {
                background-color: #fff !important;
                -webkit-print-color-adjust: exact !important; /* For Chrome/Safari */
                color-adjust: exact !important; /* Standard */
            }
            #root > div {
                margin: 0 !important;
                padding: 0 !important;
                box-shadow: none !important;
            }
            .print\\:hidden,
            header,
            nav,
            .fixed.bottom-8, /* Back button */
            .fixed.bottom-24, /* Toast messages */
            .p-4.space-y-6.pb-24 > .flex.justify-between.items-center.mb-6 /* MemoPrintView nav buttons */
            {
                display: none !important;
            }
            .print\\:block {
                display: block !important;
            }
            .print\\:text-black {
                color: #000 !important;
            }
            .print\\:text-gray-700 {
                color: #374151 !important;
            }
            .print\\:text-emerald-700 {
                color: #047857 !important;
            }
            .print\\:text-red-700 {
                color: #b91c1c !important;
            }
            .print\\:bg-white {
                background-color: #fff !important;
            }
            .print\\:bg-gray-50 {
                background-color: #f9fafb !important;
            }
            .print\\:shadow-none {
                box-shadow: none !important;
            }
            .print\\:border-0 {
                border: 0 !important;
            }
            .print\\:p-0 {
                padding: 0 !important;
            }
            .print\\:m-0 {
                margin: 0 !important;
            }
            .print\\:float-right {
                float: right !important;
            }
            .print\\:ml-4 {
                margin-left: 1rem !important;
            }
            .print\\:mb-2 {
                margin-bottom: 0.5rem !important;
            }
            .print\\:max-w-\\[80px\\] {
                max-width: 80px !important;
            }
             /* Ensure specific text colors are black on print */
            h1, h2, h3, h4, h5, p, span, div.font-black, div.font-bold {
                color: #000 !important;
            }
            /* Override for specific elements if needed, targeting general text */
            .text-gray-800, .text-gray-900, .text-app-green, .text-emerald-700 {
                color: #000 !important;
            }
            .text-red-600 {
                color: #dc2626 !important; /* Keep red for emphasis if needed */
            }
            /* Clear floats for print */
            .clear-both {
                clear: both !important;
            }
            /* Page break for elements */
            .break-inside-avoid-page {
                break-inside: avoid-page;
            }
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.4",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/",
    "firebase/": "https://esm.sh/firebase@^12.8.0/",
    "vite": "https://esm.sh/vite@^7.3.1",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
<body>
    <div id="loading-screen">
        <div class="spinner"></div>
        <h2 style="color: white; margin-top: 20px; font-weight: 900; font-size: 24px;">Digital দর্জি</h2>
        <p style="color: white; opacity: 0.7; font-size: 12px; margin-top: 5px;">অপেক্ষা করুন...</p>
    </div>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
    <script>
      window.addEventListener('load', () => {
        // Store referrer mobile from URL for App.tsx
        const urlParams = new URLSearchParams(window.location.search);
        const referrerMobile = urlParams.get('referrer');
        if (referrerMobile) {
          localStorage.setItem('asraful_initial_referrer_mobile', referrerMobile);
        } else {
          localStorage.removeItem('asraful_initial_referrer_mobile'); // Clear if no referrer in URL
        }

        setTimeout(() => {
          const loader = document.getElementById('loading-screen');
          if(loader) loader.style.opacity = '0';
          setTimeout(() => loader?.remove(), 500);
        }, 1500);
      });
    </script>
</body>
</html>
